[project]
name = "api-python"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.3",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false
# starlette < 1.3.1: GHSA high-severity Advisory (transitive via fastapi). Erzwungener Fix-Schwellwert.
constraint-dependencies = ["starlette>=1.3.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
