name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api-python, web-node]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: GHCR-Pfad in Kleinbuchstaben ermitteln
        id: vars
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Bei GHCR anmelden
        if: github.event_name == 'push'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen (und bei Push nach main veröffentlichen)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: services/${{ matrix.service }}
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.service }}:${{ github.sha }}
          load: true
          push: ${{ github.event_name == 'push' }}

      - name: Nicht-Root-Voreinstellung verifizieren
        run: |
          image="ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.service }}:${{ github.sha }}"
          user="$(docker inspect --format='{{.Config.User}}' "$image")"
          if [ -z "$user" ] || [ "$user" = "0" ] || [ "$user" = "root" ] || [ "$user" = "0:0" ]; then
            echo "::error::Image $image ist als Root konfiguriert (Config.User='$user')."
            exit 1
          fi
          echo "Nicht-Root bestätigt: Config.User=$user"

      - name: Digest festhalten
        if: github.event_name == 'push'
        run: |
          echo "### Image-Digest: ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
