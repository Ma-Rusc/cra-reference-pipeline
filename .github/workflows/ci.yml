name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [api-python, web-node]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Referenzen ableiten (Kleinbuchstaben-Owner, Image-Tag)
        id: vars
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="${OWNER,,}"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF=ghcr.io/$owner/${{ matrix.service }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Image bauen (nur lokal, Push erfolgt erst nach grünem Gate im push-Job)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: services/${{ matrix.service }}
          tags: ${{ env.IMAGE_REF }}
          load: true
          push: false

      - name: Nicht-Root-Voreinstellung verifizieren
        run: |
          user="$(docker inspect --format='{{.Config.User}}' "$IMAGE_REF")"
          if [ -z "$user" ] || [ "$user" = "0" ] || [ "$user" = "root" ] || [ "$user" = "0:0" ]; then
            echo "::error::Image $IMAGE_REF ist als Root konfiguriert (Config.User='$user')."
            exit 1
          fi
          echo "Nicht-Root bestätigt: Config.User=$user"

      - name: "Smoke-Test: Container starten"
        # Nur Portfreigabe, kein --privileged, kein Host-Volume-Mount.
        run: |
          if [ "${{ matrix.service }}" = "api-python" ]; then PORT=8000; else PORT=3000; fi
          echo "SMOKE_PORT=$PORT" >> "$GITHUB_ENV"
          docker run -d --name smoke -p "$PORT:$PORT" "$IMAGE_REF"

      - name: "Smoke-Test: /version prüfen"
        run: |
          sleep 5
          docker logs smoke || true
          curl -sf "localhost:$SMOKE_PORT/version"

      - name: "Smoke-Test: Container aufräumen"
        if: always()
        run: docker rm -f smoke || true

      - name: Image-ID festhalten
        # Inhaltsadressierte Docker-Image-ID (Hash aus Layern + Config,
        # unabhaengig von einem Registry-Push). Wird zusammen mit dem
        # Tarball weitergereicht, damit der push-Job nach dem Laden
        # beweisen kann, dass er exakt dieses und kein neu gebautes
        # Image veroeffentlicht.
        run: docker inspect --format='{{.Id}}' "$IMAGE_REF" > image-id.txt

      - name: Image als Archiv sichern
        run: docker save "$IMAGE_REF" -o image.tar

      - name: Image-Archiv als Artefakt hochladen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.service }}
          path: |
            image.tar
            image-id.txt
          retention-days: 1

      - name: Image-ID im Step-Summary festhalten
        run: |
          echo "### Image-ID: ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat image-id.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Registry-Digest folgt erst nach dem push-Job (Gate muss vorher grün sein)." >> "$GITHUB_STEP_SUMMARY"

  sbom:
    name: sbom (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      matrix:
        service: [api-python, web-node]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Image-Archiv herunterladen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.service }}

      - name: SBOM-Verzeichnis anlegen
        # CI-spezifischer Kompromiss, kein Vorbild fuer lokale Docker-Aufrufe:
        # Die syft-Container laufen unten bewusst OHNE --user "$(id -u):$(id -g)"
        # (anders als CLAUDE.md Regel 17 es fuer lokale Bind-Mounts vorschreibt),
        # weil anchore/syft@sha256:... beim docker-archive-Scan sein eigenes,
        # fest eingerichtetes /tmp und /.cache braucht - eine erzwungene fremde
        # UID kann dort nicht schreiben (daran scheiterte der erste Versuch in
        # Stufe 2). Weil die interne UID des Containers dadurch unbekannt
        # bleibt, muss sbom/ world-writable sein, damit er dort hineinschreiben
        # kann. Auf einer Wegwerf-Runner-VM unproblematisch; ein lokaler Nachbau
        # dieser Befehle wuerde die SBOM-Dateien als root im Working Tree
        # erzeugen - dafuer lokal immer --user setzen.
        run: |
          mkdir -p sbom
          chmod 777 sbom

      - name: Quell-SBOM erzeugen
        run: |
          docker run --rm \
            -v "$PWD/services/${{ matrix.service }}:/src:ro" \
            -v "$PWD/sbom:/out" \
            anchore/syft@sha256:1288ea4c8b38767b4e620c1e312c8cb26b6e887a99b4f07ab6cd19fc6f225026 \
            scan dir:/src -o cyclonedx-json=/out/${{ matrix.service }}-source.cdx.json

      - name: Image-SBOM erzeugen (per Digest-Archiv, nicht per Tag)
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            anchore/syft@sha256:1288ea4c8b38767b4e620c1e312c8cb26b6e887a99b4f07ab6cd19fc6f225026 \
            scan docker-archive:/work/image.tar -o cyclonedx-json=/work/sbom/${{ matrix.service }}-image.cdx.json

      - name: Quell-SBOM hochladen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.service }}-source
          path: sbom/${{ matrix.service }}-source.cdx.json
          retention-days: 90

      - name: Image-SBOM hochladen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.service }}-image
          path: sbom/${{ matrix.service }}-image.cdx.json
          retention-days: 90

      - name: Plausibilität prüfen (Image-SBOM muss mehr Komponenten haben als Quell-SBOM)
        run: |
          source_count="$(jq '.components | length' "sbom/${{ matrix.service }}-source.cdx.json")"
          image_count="$(jq '.components | length' "sbom/${{ matrix.service }}-image.cdx.json")"
          echo "Quell-SBOM: $source_count Komponenten"
          echo "Image-SBOM: $image_count Komponenten"
          if [ "$image_count" -le "$source_count" ]; then
            echo "::error::Image-SBOM ($image_count) hat nicht mehr Komponenten als Quell-SBOM ($source_count) - unplausibel fuer ein Container-Image mit OS-Paketen."
            exit 1
          fi

  scan:
    name: scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: sbom
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - service: api-python
            lockfile: uv.lock
          - service: web-node
            lockfile: package-lock.json
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Image-SBOM herunterladen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ matrix.service }}-image

      - name: Report-Verzeichnis anlegen
        # Gleiches Muster wie im sbom-Job: die Scanner unten laufen ohne
        # erzwungene Host-UID, ihre interne UID ist daher unbekannt.
        # World-writable ist ein bewusster CI-Kompromiss fuer eine
        # Wegwerf-Runner-VM, kein Vorbild fuer lokale Docker-Aufrufe.
        run: |
          mkdir -p reports
          chmod 777 reports

      - name: grype gegen Image-SBOM
        run: |
          docker run --rm -v "$PWD:/work" \
            anchore/grype@sha256:ddf9e9f204049f3a4a0955ef70873cabab6a31432125ad4f20a490b54950a253 \
            sbom:/work/${{ matrix.service }}-image.cdx.json \
            -o sarif=/work/reports/grype-${{ matrix.service }}.sarif

      - name: grype-SARIF hochladen
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: reports/grype-${{ matrix.service }}.sarif
          category: grype-${{ matrix.service }}

      - name: grype gegen Image-SBOM (JSON für das Policy-Gate)
        # Enger Mount als beim SARIF-Schritt oben: SBOM read-only, nur
        # reports/ beschreibbar, kein Zugriff auf den Rest des Workspace.
        # Der bestehende SARIF-Schritt bleibt bewusst unverändert (Stufe 3,
        # außerhalb des Scopes dieser Änderung).
        run: |
          docker run --rm \
            -v "$PWD/${{ matrix.service }}-image.cdx.json:/work/${{ matrix.service }}-image.cdx.json:ro" \
            -v "$PWD/reports:/work/reports" \
            -w /work \
            anchore/grype@sha256:ddf9e9f204049f3a4a0955ef70873cabab6a31432125ad4f20a490b54950a253 \
            sbom:/work/${{ matrix.service }}-image.cdx.json \
            -o json=/work/reports/grype-${{ matrix.service }}.json

      - name: grype-JSON als Artefakt hochladen
        # Kurzlebiges Zwischenartefakt für den policy-Job im selben Workflow-
        # Lauf, gleiches Muster wie image-<service>.tar.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grype-json-${{ matrix.service }}
          path: reports/grype-${{ matrix.service }}.json
          retention-days: 1

      - name: osv-scanner gegen Lockfile
        # osv-scanner beendet sich per Default mit Exit-Code 1 bei Funden.
        # Stufe 3 sammelt nur (Gate kommt in Stufe 4), daher || true.
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/google/osv-scanner@sha256:8108ae94eadea5a02c9bec6e646909d5b790b44bd62d7f5b7f0b1d6d0ffc7734 \
            scan -L services/${{ matrix.service }}/${{ matrix.lockfile }} \
            --format sarif --output-file reports/osv-scanner-${{ matrix.service }}.sarif || true

      - name: osv-scanner-SARIF hochladen
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: reports/osv-scanner-${{ matrix.service }}.sarif
          category: osv-scanner-${{ matrix.service }}

      - name: semgrep gegen services/${{ matrix.service }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            semgrep/semgrep@sha256:f1f7b71861c7b28b6e0f661225a2c4f58a484f5d0f182465c6d6b3b22f972ade \
            semgrep scan --config=p/ci --sarif \
            --sarif-output=reports/semgrep-${{ matrix.service }}.sarif \
            services/${{ matrix.service }}

      - name: semgrep-SARIF hochladen
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: reports/semgrep-${{ matrix.service }}.sarif
          category: semgrep-${{ matrix.service }}

      - name: trivy Lizenz-Scan gegen Image-SBOM
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            sbom ${{ matrix.service }}-image.cdx.json --scanners license \
            --format sarif --output reports/trivy-license-${{ matrix.service }}.sarif

      - name: trivy-license-SARIF hochladen
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: reports/trivy-license-${{ matrix.service }}.sarif
          category: trivy-license-${{ matrix.service }}

  policy:
    name: policy (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: scan
    # Kein security-events: write — conftest erzeugt kein SARIF, das
    # Ergebnis geht sichtbar ins Job-Log und in $GITHUB_STEP_SUMMARY.
    permissions:
      contents: read
    strategy:
      # fail-fast: false ist hier kein Stilmittel, sondern notwendig: dieser
      # PR lässt policy (api-python) bewusst rot enden (siehe Kontext oben),
      # ohne dieses Flag würde GitHub Actions policy (web-node) daraufhin
      # abbrechen (cancelled), bevor dessen echtes, erwartet grünes Ergebnis
      # überhaupt beobachtbar ist.
      fail-fast: false
      matrix:
        service: [api-python, web-node]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: grype-JSON herunterladen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grype-json-${{ matrix.service }}
          path: reports

      - name: Scan-Ergebnis und VEX-Daten validieren
        # Schutz gegen stillen Fehlschlag: eine fehlende oder leere Datei
        # darf nie stillschweigend als "keine Funde" durchgehen.
        run: |
          test -s reports/grype-${{ matrix.service }}.json \
            || { echo "::error::grype-JSON fehlt oder ist leer"; exit 1; }
          jq -e '.matches != null' reports/grype-${{ matrix.service }}.json > /dev/null \
            || { echo "::error::grype-JSON hat kein 'matches'-Feld — kein valides Scan-Ergebnis"; exit 1; }
          for f in vex/*.json; do
            jq -e '.statements != null and (.statements | length) > 0' "$f" > /dev/null \
              || { echo "::error::$f ist kein valides OpenVEX-Dokument (fehlendes/leeres statements-Array)"; exit 1; }
          done

      - name: VEX-Statements zusammenführen
        # conftest würde mehrere --data-Dateien mit demselben Top-Level-Key
        # "statements" beim Laden überschreiben statt zusammenzuführen
        # (verifiziert gegen die conftest-Doku) — deshalb explizit per jq,
        # nicht per --data vex/. Jede Statement-Kopie bekommt zusätzlich das
        # Quelldokument (_source_document) für das Step-Summary unten.
        run: |
          jq -s '{statements: [.[] | . as $doc | $doc.statements[] | . + {"_source_document": $doc["@id"]}]}' \
            vex/*.json > reports/vex-combined.json
          count=$(jq '.statements | length' reports/vex-combined.json)
          [ "$count" -gt 0 ] || { echo "::error::Zusammengeführte VEX-Statements sind leer"; exit 1; }
          echo "VEX-Statements zusammengeführt: $count"

      - name: Policy-Gate (conftest)
        # Enge, read-only Mounts: conftest liest nur policy/ und reports/,
        # schreibt nichts. Exit-Code wird bewusst manuell ausgewertet
        # (set +e/set -e), damit das Step-Summary auch bei einem
        # fehlschlagenden Gate geschrieben wird, bevor der Schritt rot wird.
        run: |
          set +e
          docker run --rm \
            -v "$PWD/policy:/project/policy:ro" \
            -v "$PWD/reports:/project/reports:ro" \
            -w /project \
            openpolicyagent/conftest@sha256:a38ba21668929a00dce2fe6ee43d1312228340bce5fd243f47dd0ce90516e558 \
            test --policy policy/ --data reports/vex-combined.json --output json \
            reports/grype-${{ matrix.service }}.json > policy-result.json
          CONFTEST_EXIT=$?
          set -e

          {
            echo "### Policy-Gate: ${{ matrix.service }}"
            echo
            echo "**Abgedeckt durch VEX (warn, nicht blockierend):**"
            jq -r '.[].warnings[]?.msg // empty' policy-result.json | sed 's/^/- /'
            echo
            echo "**Ohne VEX-Abdeckung (deny, blockierend):**"
            jq -r '.[].failures[]?.msg // empty' policy-result.json | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$CONFTEST_EXIT"

  push:
    name: push (${{ matrix.service }})
    runs-on: ubuntu-latest
    # Erst nach sbom, scan UND policy — ein rotes Gate verhindert den
    # Push technisch, nicht nur eine nachtraegliche, sichtbare Bewertung.
    needs: [sbom, scan, policy]
    # Bei einem PR wird ohnehin nicht gepusht (wie zuvor im build-Job).
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api-python, web-node]
    steps:
      - name: Referenzen ableiten (Kleinbuchstaben-Owner, Image-Tag)
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="${OWNER,,}"
          echo "IMAGE_REF=ghcr.io/$owner/${{ matrix.service }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Image-Artefakt herunterladen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.service }}

      - name: Image laden und Identität gegen das geprüfte Artefakt verifizieren
        # Beweist, dass das hier zu pushende Image bitidentisch mit dem
        # ist, das sbom/scan/policy tatsächlich bewertet haben — nicht
        # nur angenommen, weil beide aus demselben Artefakt-Namen stammen.
        run: |
          docker load -i image.tar
          actual_id="$(docker inspect --format='{{.Id}}' "$IMAGE_REF")"
          expected_id="$(cat image-id.txt)"
          if [ "$actual_id" != "$expected_id" ]; then
            echo "::error::Geladene Image-ID ($actual_id) weicht von der im build-Job festgehaltenen ID ($expected_id) ab — das gescannte Artefakt ist nicht identisch mit dem zu pushenden Image."
            exit 1
          fi
          echo "Image-ID verifiziert (identisch mit dem in sbom/scan/policy geprüften Artefakt): $actual_id"

      - name: Bei GHCR anmelden
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image pushen
        run: docker push "$IMAGE_REF"

      - name: Registry-Digest festhalten
        run: |
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_REF")"
          {
            echo "### Image gepusht: ${{ matrix.service }}"
            echo '```'
            echo "$digest"
            echo '```'
            echo "Image-ID (verifiziert identisch mit dem geprüften Artefakt): $(cat image-id.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout (volle Historie)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Report-Verzeichnis anlegen
        run: |
          mkdir -p reports
          chmod 777 reports

      - name: Working Tree scannen
        # --redact ist Pflicht: das Repo ist public, ein Fund landet sonst
        # im Klartext in einer oeffentlich einsehbaren Code-Scanning-Ansicht.
        # || true: Stufe 3 sammelt nur, Gate kommt in Stufe 4.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir . --config .gitleaks.toml --redact \
            --report-format sarif --report-path reports/gitleaks-workingtree.sarif || true

      - name: gitleaks-SARIF hochladen (Working Tree)
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: reports/gitleaks-workingtree.sarif
          category: gitleaks-workingtree

      - name: Historie scannen
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git . --config .gitleaks.toml --redact \
            --report-format sarif --report-path reports/gitleaks-history.sarif || true

      - name: gitleaks-SARIF hochladen (Historie)
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: reports/gitleaks-history.sarif
          category: gitleaks-history
